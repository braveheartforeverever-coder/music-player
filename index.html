<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Music</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #000000;
            --bg-elevated: #121212;
            --bg-surface: #181818;
            --bg-highlight: #1a1a1a;
            --bg-hover: #282828;
            --bg-pressed: #333333;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --text-tertiary: #6a6a6a;
            --accent: #1DB954;
            --accent-hover: #1ed760;
            --accent-dim: rgba(29, 185, 84, 0.12);
            --accent-glow: rgba(29, 185, 84, 0.25);
            --border: rgba(255, 255, 255, 0.06);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.6);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-xs: 6px;
            --radius-full: 9999px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--bg-elevated);
        }

        /* Header */
        .header {
            padding: 56px 24px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 24px;
            right: 24px;
            height: 1px;
            background: var(--border);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-logo svg {
            width: 18px;
            height: 18px;
            fill: var(--bg-base);
        }

        .header-title {
            font-size: 13px;
            letter-spacing: 1.5px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-full);
            border: none;
            background: var(--bg-surface);
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .icon-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .icon-btn:active {
            transform: scale(0.92);
            background: var(--bg-pressed);
        }

        .icon-btn.danger {
            color: var(--text-tertiary);
        }

        .icon-btn.danger:hover {
            color: #e35353;
            background: rgba(227, 83, 83, 0.12);
        }

        /* Playlist */
        .playlist-section {
            flex: 1;
            padding: 16px 12px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .playlist-section::-webkit-scrollbar {
            width: 4px;
        }

        .playlist-section::-webkit-scrollbar-track {
            background: transparent;
        }

        .playlist-section::-webkit-scrollbar-thumb {
            background: var(--bg-hover);
            border-radius: 2px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 32px;
            text-align: center;
        }

        .empty-state-icon {
            width: 80px;
            height: 80px;
            border-radius: var(--radius);
            background: var(--bg-surface);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 24px;
            color: var(--text-tertiary);
            border: 1px solid var(--border);
        }

        .empty-state-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .empty-state-desc {
            font-size: 14px;
            color: var(--text-tertiary);
            line-height: 1.5;
        }

        /* Track Items */
        .track-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 2px;
            border-radius: var(--radius-xs);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            gap: 12px;
        }

        .track-item:hover {
            background: var(--bg-highlight);
        }

        .track-item:active {
            background: var(--bg-hover);
        }

        .track-item.active {
            background: var(--accent-dim);
        }

        .track-artwork {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-xs);
            background: var(--bg-surface);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: var(--transition);
        }

        .track-item.active .track-artwork {
            background: linear-gradient(135deg, var(--accent) 0%, #15843d 100%);
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(29, 185, 84, 0.3);
        }

        .track-artwork-icon {
            color: var(--text-tertiary);
            font-size: 20px;
        }

        .track-item.active .track-artwork-icon {
            color: var(--bg-base);
        }

        .playing-indicator {
            display: none;
            align-items: flex-end;
            gap: 2px;
            height: 16px;
        }

        .track-item.active.playing .playing-indicator {
            display: flex;
        }

        .track-item.active.playing .track-artwork-icon {
            display: none;
        }

        .playing-bar {
            width: 3px;
            background: var(--bg-base);
            border-radius: 2px;
            animation: playingBars 0.8s ease-in-out infinite alternate;
        }

        .playing-bar:nth-child(1) { height: 8px; animation-delay: 0s; }
        .playing-bar:nth-child(2) { height: 14px; animation-delay: 0.15s; }
        .playing-bar:nth-child(3) { height: 10px; animation-delay: 0.3s; }

        @keyframes playingBars {
            0% { height: 4px; }
            100% { height: 16px; }
        }

        .track-info {
            flex: 1;
            min-width: 0;
        }

        .track-name {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.2px;
            transition: color var(--transition);
        }

        .track-item.active .track-name {
            color: var(--accent);
            font-weight: 600;
        }

        .track-meta {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 3px;
            font-weight: 400;
        }

        .track-index {
            font-size: 13px;
            color: var(--text-tertiary);
            font-weight: 500;
            min-width: 20px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .track-item:hover .track-index {
            color: var(--text-secondary);
        }

        .track-item.active .track-index {
            visibility: hidden;
        }

        .track-delete {
            opacity: 0;
            width: 28px;
            height: 28px;
            border-radius: var(--radius-full);
            border: none;
            background: rgba(227, 83, 83, 0.08);
            color: #e35353;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .track-item:hover .track-delete {
            opacity: 1;
        }

        .track-delete:hover {
            background: rgba(227, 83, 83, 0.18);
        }

        .track-delete:active {
            transform: scale(0.85);
        }

        /* Now Playing Bar */
        .now-playing {
            position: sticky;
            bottom: 0;
            background: linear-gradient(180deg, rgba(18, 18, 18, 0.85) 0%, rgba(18, 18, 18, 0.98) 100%);
            backdrop-filter: blur(32px) saturate(150%);
            -webkit-backdrop-filter: blur(32px) saturate(150%);
            border-top: 1px solid var(--border);
            padding: 0 0 env(safe-area-inset-bottom, 0);
            z-index: 100;
            transition: var(--transition-slow);
        }

        .now-playing-inner {
            padding: 14px 20px 16px;
        }

        /* Progress Bar */
        .progress-wrapper {
            position: relative;
            padding: 8px 0;
            cursor: pointer;
            touch-action: none;
        }

        .progress-track {
            width: 100%;
            height: 3px;
            background: var(--bg-hover);
            border-radius: var(--radius-full);
            overflow: visible;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: var(--text-primary);
            border-radius: var(--radius-full);
            width: 0%;
            transition: width 0.15s linear;
            position: relative;
        }

        .progress-wrapper:hover .progress-fill,
        .progress-wrapper.dragging .progress-fill {
            background: var(--accent);
        }

        .progress-wrapper:hover .progress-track,
        .progress-wrapper.dragging .progress-track {
            height: 4px;
        }

        .progress-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text-primary);
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            transition: transform 0.15s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .progress-wrapper:hover .progress-thumb,
        .progress-wrapper.dragging .progress-thumb {
            transform: translateY(-50%) scale(1);
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
        }

        .time-display span {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-tertiary);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.3px;
        }

        /* Track Info Row */
        .np-info {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 12px;
        }

        .np-artwork {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--accent) 0%, #15843d 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(29, 185, 84, 0.25);
            transition: var(--transition);
        }

        .np-artwork-icon {
            color: var(--bg-base);
            font-size: 22px;
        }

        .np-text {
            flex: 1;
            min-width: 0;
        }

        .np-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.2px;
        }

        .np-subtitle {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 2px;
            font-weight: 400;
        }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-top: 16px;
        }

        .ctrl-btn {
            border: none;
            background: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }

        .ctrl-btn:active {
            transform: scale(0.88);
        }

        .ctrl-btn:disabled {
            opacity: 0.2;
            cursor: default;
        }

        .ctrl-btn:disabled:active {
            transform: none;
        }

        .ctrl-btn svg {
            fill: var(--text-secondary);
            transition: fill var(--transition);
        }

        .ctrl-btn:hover svg {
            fill: var(--text-primary);
        }

        .ctrl-btn.mode-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-full);
        }

        .ctrl-btn.mode-btn.active svg {
            fill: var(--accent);
        }

        .ctrl-btn.mode-btn.active:hover svg {
            fill: var(--accent-hover);
        }

        .ctrl-btn.skip-btn {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-full);
        }

        .ctrl-btn.play-btn {
            width: 52px;
            height: 52px;
            border-radius: var(--radius-full);
            background: var(--text-primary);
            margin: 0 10px;
            transition: var(--transition);
        }

        .ctrl-btn.play-btn:hover {
            transform: scale(1.04);
            background: #ffffff;
        }

        .ctrl-btn.play-btn svg {
            fill: var(--bg-base);
        }

        .ctrl-btn.play-btn:active {
            transform: scale(0.94);
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-up {
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #fileInput {
            display: none;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--bg-surface);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: var(--radius-full);
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 999;
            pointer-events: none;
            white-space: nowrap;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
            letter-spacing: -0.1px;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Responsive */
        @media (max-width: 380px) {
            .header { padding: 48px 20px 16px; }
            .playlist-section { padding: 12px 8px; }
            .now-playing-inner { padding: 10px 16px 12px; }
        }

        @media (min-width: 421px) {
            .app {
                min-height: calc(100vh - 40px);
                margin: 20px auto;
                border-radius: 16px;
                box-shadow: var(--shadow-lg);
                overflow: hidden;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-brand">
                <div class="header-logo">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 14.36c-.2.3-.56.4-.86.2-2.36-1.44-5.34-1.76-8.84-.96-.34.08-.66-.12-.74-.46-.08-.34.12-.66.46-.74 3.84-.88 7.12-.5 9.78 1.1.3.18.4.56.2.86zm1.22-2.72c-.24.38-.76.5-1.14.24-2.7-1.66-6.82-2.14-10.02-1.18-.4.12-.82-.1-.94-.5-.12-.4.1-.82.5-.94 3.64-1.1 8.18-.56 11.3 1.34.36.22.48.74.3 1.04zm.1-2.84C14.76 8.88 9.14 8.7 5.98 9.64c-.48.14-.98-.12-1.12-.6-.14-.48.12-.98.6-1.12 3.64-1.08 9.68-.88 13.5 1.38.44.26.58.82.32 1.26-.26.42-.82.56-1.26.32z"/></svg>
                </div>
                <h1 class="header-title">MUSIC PLAYER</h1>
            </div>
            <div class="header-actions">
                <button class="icon-btn danger" id="clearBtn" title="清空列表" style="display:none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14"/></svg>
                </button>
                <button class="icon-btn" id="addBtn" title="添加音乐">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
            </div>
        </header>

        <input type="file" id="fileInput" accept="audio/*" multiple>

        <section class="playlist-section" id="playlistSection">
            <div class="empty-state" id="emptyState">
                <div class="empty-state-icon">♫</div>
                <div class="empty-state-title">开始聆听</div>
                <div class="empty-state-desc">轻点右上角 + 添加你喜欢的音乐</div>
            </div>
        </section>

        <div class="now-playing slide-up" id="nowPlaying">
            <div class="now-playing-inner">
                <div class="progress-wrapper" id="progressWrapper">
                    <div class="progress-track">
                        <div class="progress-fill" id="progressFill">
                            <div class="progress-thumb"></div>
                        </div>
                    </div>
                    <div class="time-display">
                        <span id="currentTime">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                </div>

                <div class="np-info">
                    <div class="np-artwork">
                        <span class="np-artwork-icon">♪</span>
                    </div>
                    <div class="np-text">
                        <div class="np-title" id="npTitle">未在播放</div>
                        <div class="np-subtitle" id="npSubtitle">选择一首歌曲</div>
                    </div>
                </div>

                <div class="controls">
                    <button class="ctrl-btn mode-btn" id="shuffleBtn" title="随机播放" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/><style>svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style></svg>
                    </button>
                    <button class="ctrl-btn skip-btn" id="prevBtn" title="上一首" disabled>
                        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M19 20L9 12l10-8v16zM5 19V5"/><style>svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style></svg>
                    </button>
                    <button class="ctrl-btn play-btn" id="playPauseBtn" title="播放" disabled>
                        <svg width="24" height="24" viewBox="0 0 24 24" id="playIcon"><polygon points="8,5 20,12 8,19"/></svg>
                    </button>
                    <button class="ctrl-btn skip-btn" id="nextBtn" title="下一首" disabled>
                        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4zM19 5v14"/><style>svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style></svg>
                    </button>
                    <button class="ctrl-btn mode-btn" id="repeatBtn" title="循环播放" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/><style>svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style></svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="toast" id="toast"></div>
    </div>

    <audio id="audioPlayer"></audio>
    <script src="app.js"></script>
</body>
</html>
